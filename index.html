<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Happiest Man Alive</title>
<meta name="description" content="The Happiest Man Alive. Official merch.">
<meta property="og:title" content="The Happiest Man Alive">
<meta property="og:description" content="Official merch from The Happiest Man Alive.">
<meta property="og:image" content="https://thehappiestmanalive.com/logo.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--midnight:#0b1733;--midnight-2:#13224a;--blue:#2f6bff;--sky:#7fb0ff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Montserrat,system-ui,sans-serif;color:#fff;
    background:radial-gradient(circle at 50% 38%,var(--midnight-2),var(--midnight) 70%);
    background-color:var(--midnight);
    min-height:100vh;display:flex;flex-direction:column;
  }
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px}
  .logo{width:min(420px,80vw);border-radius:50%;margin-bottom:36px;
    box-shadow:0 0 0 12px rgba(47,107,255,.12),0 30px 90px rgba(0,0,0,.5);
    animation:float 6s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-10px)}}
  @media (prefers-reduced-motion:reduce){.logo{animation:none}}
  h1{font-size:clamp(1.9rem,6vw,3.4rem);font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
  p{color:#cfe0ff;font-size:clamp(1rem,2.4vw,1.2rem);font-weight:500;margin:14px 0 34px;letter-spacing:.04em}
  .btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;
    font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;padding:18px 44px;border-radius:999px;
    box-shadow:0 10px 30px rgba(47,107,255,.4);transition:transform .15s,background .15s}
  .btn:hover{background:#4a7fff;transform:translateY(-2px)}
  .dots{display:flex;gap:10px;justify-content:center;margin-top:44px}
  .dots span{width:9px;height:9px;border-radius:50%;background:var(--sky);opacity:.7}
  footer{text-align:center;color:#8ea3cf;font-size:.8rem;padding:24px 20px;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="The Happiest Man Alive logo">
  <h1>The Happiest Man Alive</h1>
  <p>Happiness looks good on you.</p>
 <a class="btn" href="https://qtrifn-xf.myshopify.com">Shop the Merch</a>
  <div class="dots"><span></span><span></span><span></span></div>
</main>
<footer>© <span id="yr">2026</span> The Happiest Man Alive</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
